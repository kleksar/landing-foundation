name: compatibility

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/compatibility.yml
      - playwright.config.ts
      - package.json
      - bun.lock
      - tests/e2e/**

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bunx --no-install playwright install --with-deps firefox webkit
      # Refresh preinstalled Chrome only on this disposable GitHub-hosted runner.
      - run: bunx --no-install playwright install chrome --force
      - name: Record actual browser versions
        run: |
          node --input-type=module <<'JS'
          import { chromium, firefox, webkit } from '@playwright/test';
          for (const [name, engine, options] of [
            ['chrome', chromium, { channel: 'chrome' }],
            ['firefox', firefox, {}],
            ['webkit', webkit, {}],
          ]) {
            const browser = await engine.launch(options);
            try {
              console.log(`${name}: ${browser.version()}`);
            } finally {
              await browser.close();
            }
          }
          JS
      - run: bun run test:compat --workers=1
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compatibility-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
